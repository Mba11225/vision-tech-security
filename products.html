<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCTV Products Catalog | Vision Tech Security Peshawar</title>
  <meta name="description" content="Browse our complete catalog of CCTV cameras, DVR/NVR recorders, surveillance hard drives, networking cable, PoE switches and accessories in Peshawar, KPK.">
  <link rel="canonical" href="./products.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="CCTV Products Catalog | Vision Tech Security Peshawar">
  <meta property="og:description" content="Browse our complete catalog of CCTV cameras, DVR/NVR recorders, surveillance hard drives, networking cable, PoE switches and accessories in Peshawar.">
  <meta property="og:url" content="./products.html">
  <link rel="stylesheet" href="css/style.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [{
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "./index.html"
    },{
      "@type": "ListItem",
      "position": 2,
      "name": "Products",
      "item": "./products.html"
    }]
  }
  </script>
</head>
<body>

  <header id="main-header"></header>

  <main style="padding: 40px 0 80px 0;">
    <div class="container">
      <!-- Breadcrumb -->
      <div style="font-size: 0.85rem; color: var(--text-dim); margin-bottom: 20px;">
        <a href="index.html" style="color: var(--text-muted);">Home</a>
        <span style="margin: 0 8px;">/</span>
        <span style="color: var(--accent-cyan);">Products Catalog</span>
      </div>

      <div class="section-header" style="text-align: left; margin-bottom: 30px;">
        <div class="section-tag">Complete Catalog</div>
        <h1 class="section-title">All Security & CCTV Equipment</h1>
        <p class="section-subtitle">Genuine security cameras, video recording units, surveillance storage and networking supplies in Peshawar.</p>
      </div>

      <div class="catalog-layout">
        <!-- Sidebar Filters -->
        <aside class="filter-sidebar">
          <div class="filter-header">
            <span class="filter-title">
              <svg style="width: 18px; height: 18px; color: var(--accent-cyan);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
              <span>Filter Equipment</span>
            </span>
            <button type="button" class="filter-reset-btn" id="resetFiltersBtn">Reset All</button>
          </div>

          <!-- Filter Brand -->
          <div class="filter-group">
            <h4 class="filter-group-title">Brand</h4>
            <div class="filter-checkbox-list">
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterBrand" value="Hikvision"> Hikvision
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterBrand" value="EZVIZ"> EZVIZ
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterBrand" value="Imou"> Imou
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterBrand" value="Dahua"> Dahua
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterBrand" value="V380"> V380
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterBrand" value="Western Digital"> Western Digital
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterBrand" value="Seagate"> Seagate
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterBrand" value="Tenda"> Tenda
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterBrand" value="TP-Link"> TP-Link
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterBrand" value="D-Link"> D-Link
              </label>
            </div>
          </div>

          <!-- Filter Resolution -->
          <div class="filter-group">
            <h4 class="filter-group-title">Resolution</h4>
            <div class="filter-checkbox-list">
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterResolution" value="2MP"> 2MP (1080p Full HD)
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterResolution" value="3MP"> 3MP (2K Super HD)
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterResolution" value="4MP"> 4MP (2K QHD)
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterResolution" value="5MP"> 5MP (Pro Resolution)
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterResolution" value="8MP"> 8MP / 4K Ultra HD
              </label>
            </div>
          </div>

          <!-- Filter Type -->
          <div class="filter-group">
            <h4 class="filter-group-title">Camera Type</h4>
            <div class="filter-checkbox-list">
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterType" value="Bullet"> Bullet
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterType" value="Dome"> Dome / Turret
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterType" value="PTZ"> PTZ / Pan-Tilt
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterType" value="Indoor"> Indoor
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterType" value="Outdoor"> Outdoor Weatherproof
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterType" value="Wi-Fi"> Wi-Fi Wireless
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterType" value="PoE"> PoE (Power over Ethernet)
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterType" value="IP Camera"> IP Camera
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="filterType" value="Analog Camera"> Analog HD Camera
              </label>
            </div>
          </div>

        </aside>

        <!-- Catalog Product Grid & Controls -->
        <div>
          <div class="catalog-top-bar">
            <div class="catalog-count-text" id="catalogProductCount">Loading products...</div>
            <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
              <div class="catalog-search-input-wrap">
                <svg style="width: 16px; height: 16px; color: var(--text-dim);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="filterSearchInput" placeholder="Filter by name, model...">
              </div>
              <select id="catalogSortSelect" class="form-control" style="width: auto; padding: 6px 12px; font-size: 0.85rem;">
                <option value="default">Sort by: Featured</option>
                <option value="name-asc">Name: A to Z</option>
                <option value="name-desc">Name: Z to A</option>
                <option value="brand">Brand: A to Z</option>
              </select>
            </div>
          </div>

          <div class="products-grid" id="catalogProductGrid">
            <!-- Populated via App.initFilters -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer id="main-footer"></footer>

  <script src="js/products-data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      Navigation.init("products");
      App.initFilters(null);
    });
  </script>
</body>
</html>
