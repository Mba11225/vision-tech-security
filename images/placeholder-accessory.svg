<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.15)" />
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0)" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#grid)" />
  <circle cx="400" cy="260" r="230" fill="url(#glowGrad)" />

  <!-- CCTV Power & Connectors Vector Illustration -->
  <g transform="translate(400, 250)">
    <!-- Centralized Power Supply Metal Enclosure -->
    <rect x="-130" y="-110" width="160" height="210" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2.5" />
    <!-- Perforated mesh on PSU box -->
    <rect x="-115" y="-95" width="130" height="130" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <!-- Perforation Dots -->
    <g fill="#334155" opacity="0.6">
      <circle cx="-100" cy="-80" r="3" /><circle cx="-80" cy="-80" r="3" /><circle cx="-60" cy="-80" r="3" /><circle cx="-40" cy="-80" r="3" /><circle cx="-20" cy="-80" r="3" /><circle cx="0" cy="-80" r="3" />
      <circle cx="-100" cy="-60" r="3" /><circle cx="-80" cy="-60" r="3" /><circle cx="-60" cy="-60" r="3" /><circle cx="-40" cy="-60" r="3" /><circle cx="-20" cy="-60" r="3" /><circle cx="0" cy="-60" r="3" />
      <circle cx="-100" cy="-40" r="3" /><circle cx="-80" cy="-40" r="3" /><circle cx="-60" cy="-40" r="3" /><circle cx="-40" cy="-40" r="3" /><circle cx="-20" cy="-40" r="3" /><circle cx="0" cy="-40" r="3" />
      <circle cx="-100" cy="-20" r="3" /><circle cx="-80" cy="-20" r="3" /><circle cx="-60" cy="-20" r="3" /><circle cx="-40" cy="-20" r="3" /><circle cx="-20" cy="-20" r="3" /><circle cx="0" cy="-20" r="3" />
      <circle cx="-100" cy="0" r="3" /><circle cx="-80" cy="0" r="3" /><circle cx="-60" cy="0" r="3" /><circle cx="-40" cy="0" r="3" /><circle cx="-20" cy="0" r="3" /><circle cx="0" cy="0" r="3" />
      <circle cx="-100" cy="20" r="3" /><circle cx="-80" cy="20" r="3" /><circle cx="-60" cy="20" r="3" /><circle cx="-40" cy="20" r="3" /><circle cx="-20" cy="20" r="3" /><circle cx="0" cy="20" r="3" />
    </g>

    <!-- Terminal Strip on PSU bottom -->
    <rect x="-115" y="45" width="130" height="40" rx="4" fill="#0b1329" stroke="#334155" stroke-width="1.5" />
    <circle cx="-95" cy="65" r="4" fill="#f59e0b" />
    <circle cx="-75" cy="65" r="4" fill="#f59e0b" />
    <circle cx="-55" cy="65" r="4" fill="#f59e0b" />
    <circle cx="-35" cy="65" r="4" fill="#f59e0b" />
    <circle cx="-15" cy="65" r="4" fill="#f59e0b" />
    <circle cx="5" cy="65" r="4" fill="#10b981" />

    <!-- Pure Copper BNC Connector Beside PSU -->
    <g transform="translate(90, -40)">
      <rect x="-18" y="-12" width="36" height="24" rx="4" fill="#b45309" stroke="#f59e0b" stroke-width="2" />
      <!-- BNC bayonet collar -->
      <circle cx="0" cy="0" r="16" fill="none" stroke="#d97706" stroke-width="2.5" />
      <rect x="-6" y="-22" width="12" height="10" fill="#78350f" rx="1" />
      <rect x="-6" y="12" width="12" height="10" fill="#78350f" rx="1" />
      <!-- Center Gold Pin -->
      <circle cx="0" cy="0" r="4" fill="#fbbf24" />
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#f59e0b" text-anchor="middle">BNC</text>
    </g>

    <!-- DC Power Jack Beside PSU -->
    <g transform="translate(90, 50)">
      <rect x="-24" y="-14" width="48" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <!-- Male DC barrel probe -->
      <rect x="24" y="-6" width="22" height="12" rx="2" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="40" y="-3" width="6" height="6" fill="#0f172a" />
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">12V DC</text>
    </g>
  </g>

  <!-- Product Category Label Badge -->
  <g transform="translate(400, 470)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">CCTV ACCESSORY &amp; POWER</text>
  </g>

  <!-- Branding Text -->
  <text x="400" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">VISION TECH SECURITY</text>
  <text x="400" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Connectors &amp; Power Supplies • Peshawar, KPK</text>
</svg>
