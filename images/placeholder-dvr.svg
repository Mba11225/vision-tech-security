<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#grid)" />
  <circle cx="400" cy="260" r="230" fill="url(#glowGrad)" />

  <!-- DVR/NVR Hardware Illustration -->
  <g transform="translate(400, 260)">
    <!-- Main Chassis Box (Isometric perspective) -->
    <!-- Top Face -->
    <polygon points="-190,-40 0,-100 190,-40 0,20" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <!-- Cooling vents on top -->
    <line x1="-80" y1="-50" x2="60" y2="-10" stroke="#0f172a" stroke-width="3" stroke-dasharray="10 5" />
    <line x1="-70" y1="-60" x2="70" y2="-20" stroke="#0f172a" stroke-width="3" stroke-dasharray="10 5" />
    <line x1="-60" y1="-70" x2="80" y2="-30" stroke="#0f172a" stroke-width="3" stroke-dasharray="10 5" />

    <!-- Left Side Face -->
    <polygon points="-190,-40 0,20 0,90 -190,30" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <!-- Front Bezel Face -->
    <polygon points="0,20 190,-40 190,30 0,90" fill="#111827" stroke="#38bdf8" stroke-width="2" />

    <!-- Front Panel Elements -->
    <!-- Power LED -->
    <ellipse cx="30" cy="50" rx="3" ry="2" fill="#10b981" />
    <!-- HDD Activity LED -->
    <ellipse cx="45" cy="46" rx="3" ry="2" fill="#38bdf8" />
    <!-- Network LED -->
    <ellipse cx="60" cy="42" rx="3" ry="2" fill="#f59e0b" />

    <!-- USB Port -->
    <polygon points="120,15 140,9 140,18 120,24" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <!-- Front logo badge -->
    <polygon points="155,5 175,-1 175,7 155,13" fill="#0284c7" opacity="0.6" />
  </g>

  <!-- Product Category Label Badge -->
  <g transform="translate(400, 470)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">DVR / NVR RECORDER</text>
  </g>

  <!-- Branding Text -->
  <text x="400" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">VISION TECH SECURITY</text>
  <text x="400" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Surveillance Storage & Playback • Peshawar, KPK</text>
</svg>
