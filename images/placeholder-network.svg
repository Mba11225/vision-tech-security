<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.15)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0)" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#grid)" />
  <circle cx="400" cy="260" r="230" fill="url(#glowGrad)" />

  <!-- Networking Switch / PoE Hardware Illustration -->
  <g transform="translate(400, 250)">
    <!-- Switch Main Enclosure -->
    <rect x="-190" y="-55" width="380" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    
    <!-- Rack Ear Brackets -->
    <rect x="-205" y="-45" width="15" height="90" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="-197" cy="-25" r="3" fill="#475569" />
    <circle cx="-197" cy="25" r="3" fill="#475569" />

    <rect x="190" y="-45" width="15" height="90" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="197" cy="-25" r="3" fill="#475569" />
    <circle cx="197" cy="25" r="3" fill="#475569" />

    <!-- Front Bezel Inset -->
    <rect x="-180" y="-45" width="360" height="90" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />

    <!-- Power & Link Status LEDs -->
    <circle cx="-160" cy="-22" r="3" fill="#10b981" />
    <circle cx="-160" cy="-10" r="3" fill="#38bdf8" />
    <text x="-148" y="-13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#94a3b8">PWR / PoE</text>

    <!-- RJ45 Port Array (8 PoE Ports) -->
    <!-- Group of 8 Ethernet Jacks -->
    <g transform="translate(-80, 0)">
      <!-- Port 1-8 -->
      <rect x="-30" y="-20" width="22" height="24" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <circle cx="-19" cy="-27" r="2" fill="#10b981" />

      <rect x="0" y="-20" width="22" height="24" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <circle cx="11" cy="-27" r="2" fill="#10b981" />

      <rect x="30" y="-20" width="22" height="24" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <circle cx="41" cy="-27" r="2" fill="#10b981" />

      <rect x="60" y="-20" width="22" height="24" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <circle cx="71" cy="-27" r="2" fill="#10b981" />

      <rect x="90" y="-20" width="22" height="24" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <circle cx="101" cy="-27" r="2" fill="#10b981" />

      <rect x="120" y="-20" width="22" height="24" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <circle cx="131" cy="-27" r="2" fill="#10b981" />

      <rect x="150" y="-20" width="22" height="24" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <circle cx="161" cy="-27" r="2" fill="#10b981" />

      <rect x="180" y="-20" width="22" height="24" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <circle cx="191" cy="-27" r="2" fill="#10b981" />
    </g>

    <!-- Gigabit Uplink SFP / Copper Ports -->
    <rect x="135" y="-20" width="20" height="24" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="145" cy="-27" r="2" fill="#38bdf8" />
    <rect x="160" y="-20" width="20" height="24" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="170" cy="-27" r="2" fill="#38bdf8" />
  </g>

  <!-- Product Category Label Badge -->
  <g transform="translate(400, 470)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">NETWORKING &amp; PoE GEAR</text>
  </g>

  <!-- Branding Text -->
  <text x="400" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">VISION TECH SECURITY</text>
  <text x="400" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">High-Speed CCTV Infrastructure • Peshawar, KPK</text>
</svg>
