<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#grid)" />
  <circle cx="400" cy="260" r="230" fill="url(#glowGrad)" />

  <!-- Shield & Surveillance Symbol -->
  <g transform="translate(400, 240)">
    <path d="M 0 -90 L 80 -55 L 80 25 C 80 85 0 125 0 125 C 0 125 -80 85 -80 25 L -80 -55 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <path d="M 0 -70 L 60 -42 L 60 20 C 60 68 0 100 0 100 C 0 100 -60 68 -60 20 L -60 -42 Z" fill="#0f172a" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
    
    <!-- Camera Eye inside shield -->
    <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="0" cy="0" r="14" fill="#0284c7" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>

  <!-- Product Category Label Badge -->
  <g transform="translate(400, 470)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">SECURITY &amp; SURVEILLANCE</text>
  </g>

  <!-- Branding Text -->
  <text x="400" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">VISION TECH SECURITY</text>
  <text x="400" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Peshawar, Khyber Pakhtunkhwa, Pakistan</text>
</svg>
