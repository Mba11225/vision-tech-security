<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="rgba(129, 140, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0)" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#grid)" />
  <circle cx="400" cy="260" r="230" fill="url(#glowGrad)" />

  <!-- Hard Drive Illustration -->
  <g transform="translate(400, 250)">
    <!-- HDD Outer Metal Body -->
    <rect x="-110" y="-120" width="220" height="240" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2.5" />
    
    <!-- Top Platter Cover Recess -->
    <rect x="-95" y="-105" width="190" height="155" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

    <!-- Circular Disk Platter Representation -->
    <circle cx="0" cy="-28" r="62" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-dasharray="14 6" opacity="0.8" />
    <circle cx="0" cy="-28" r="44" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="0" cy="-28" r="16" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <circle cx="0" cy="-28" r="6" fill="#38bdf8" />

    <!-- Surveillance Grade Badge / Label on Drive -->
    <rect x="-95" y="60" width="190" height="48" rx="6" fill="#0b1329" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <rect x="-85" y="70" width="28" height="28" rx="4" fill="#818cf8" opacity="0.8" />
    <path d="M -76 84 L -72 88 L -62 76" fill="none" stroke="#ffffff" stroke-width="2" />
    <text x="-48" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff">24/7 SURVEILLANCE</text>
    <text x="-48" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Continuous Video Recording</text>

    <!-- Corner Screw Mounts -->
    <circle cx="-95" cy="-105" r="4" fill="#475569" />
    <circle cx="95" cy="-105" r="4" fill="#475569" />
    <circle cx="-95" cy="105" r="4" fill="#475569" />
    <circle cx="95" cy="105" r="4" fill="#475569" />
  </g>

  <!-- Product Category Label Badge -->
  <g transform="translate(400, 470)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">SURVEILLANCE STORAGE</text>
  </g>

  <!-- Branding Text -->
  <text x="400" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">VISION TECH SECURITY</text>
  <text x="400" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Surveillance Hard Drive • Peshawar, KPK</text>
</svg>
